<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Xplorio</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --ink: #14171c;
        --muted: #5b6370;
        --accent: #2f6fde;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1116;
          --ink: #e9edf3;
          --muted: #98a2b3;
          --accent: #6ea0ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Xplorio<span>.</span></h1>
      <p>Flight tracking, coming soon.</p>
    </main>
  </body>
</html>
