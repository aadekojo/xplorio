name: CodeQL

# Code scanning on a private repo requires GitHub Code Security (paid).
# This workflow is kept so it starts working automatically if the repo is made public
# or the plan is upgraded; until then the job is skipped.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.repository.visibility == 'public'
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
