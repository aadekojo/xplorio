name: Infrastructure

# Pushes to main deploy to the environment in the AUTO_DEPLOY_ENV repo variable (prod when unset).
# Later, set AUTO_DEPLOY_ENV=test so pushes land in test and prod becomes a manual run.
# Manual runs (workflow_dispatch) can target either environment.

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [prod, test]
        default: prod

permissions:
  contents: read

env:
  TARGET: ${{ inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod' }}

jobs:
  validate:
    name: Build and lint Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep lint --file infra/main.bicep
      - run: |
          for f in infra/env/*.bicepparam; do
            echo "checking $f"
            az bicep build-params --file "$f" --stdout > /dev/null
          done

  deploy:
    name: What-if and deploy (${{ inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod' }})
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: infra-${{ inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', env.TARGET)] }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        env:
          RG: ${{ vars[format('AZURE_RESOURCE_GROUP_{0}', env.TARGET)] }}
        run: |
          az deployment group what-if \
            --resource-group "$RG" \
            --template-file infra/main.bicep \
            --parameters "infra/env/${TARGET}.bicepparam" \
            --result-format ResourceIdOnly

      - name: Deploy
        env:
          RG: ${{ vars[format('AZURE_RESOURCE_GROUP_{0}', env.TARGET)] }}
        run: |
          az deployment group create \
            --resource-group "$RG" \
            --name "xplorio-${TARGET}-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters "infra/env/${TARGET}.bicepparam" \
            --query properties.outputs -o json > outputs.json

      - name: Summary
        run: |
          {
            echo "### Deployed ${TARGET}"
            echo ""
            echo "| Output | Value |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | `\(.value.value)` |"' outputs.json
            echo ""
            echo "Point this environment's Cloudflare CNAME at the staticWebAppHostname above."
          } >> "$GITHUB_STEP_SUMMARY"
