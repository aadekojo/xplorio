name: Infrastructure

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  validate:
    name: Build and lint Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
      - run: az bicep lint --file infra/main.bicep

  deploy:
    name: What-if and deploy
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Azure identity only trusts jobs in this environment (see infra/bootstrap/bootstrap.sh).
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --result-format ResourceIdOnly

      - name: Deploy
        id: deploy
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "xplorio-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json > outputs.json

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| Output | Value |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | `\(.value.value)` |"' outputs.json
            echo ""
            echo "Point the Cloudflare CNAME for \`xp\` at the staticWebAppHostname above."
          } >> "$GITHUB_STEP_SUMMARY"
