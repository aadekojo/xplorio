name: Deploy web

# Pushes to main deploy to the environment in the AUTO_DEPLOY_ENV repo variable (prod when unset).
# Later, set AUTO_DEPLOY_ENV=test so pushes land in test and prod becomes a manual run.
# Manual runs (workflow_dispatch) can target either environment.
# Builds the Expo web app with the environment's API URL baked in, then uploads it to Static Web Apps.

on:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "packages/core/**"
      - "packages/api-client/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [prod, test]
        default: prod

permissions:
  contents: read

env:
  TARGET: ${{ inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod' }}

jobs:
  deploy:
    name: Build and deploy to Static Web Apps (${{ inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-web-${{ inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RG: ${{ vars[format('AZURE_RESOURCE_GROUP_{0}', inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod')] }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: azure/login@v2
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', env.TARGET)] }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the API URL
        id: api
        run: |
          name=$(az functionapp list -g "$RG" --query "[0].name" -o tsv)
          host=$(az functionapp show -g "$RG" -n "$name" --query defaultHostName -o tsv)
          echo "url=https://$host/api" >> "$GITHUB_OUTPUT"

      - name: Build web app
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.api.outputs.url }}
        run: pnpm --filter @xplorio/app build

      # The deployment token is fetched at run time with the OIDC login, so it is never stored in GitHub.
      - name: Get deployment token
        id: token
        run: |
          name=$(az staticwebapp list -g "$RG" --query "[0].name" -o tsv)
          token=$(az staticwebapp secrets list -g "$RG" -n "$name" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: apps/app/dist
          skip_app_build: true
          skip_api_build: true
