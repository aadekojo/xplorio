name: Deploy API

# Pushes to main deploy to the environment in the AUTO_DEPLOY_ENV repo variable (prod when unset).
# Later, set AUTO_DEPLOY_ENV=test so pushes land in test and prod becomes a manual run.
# Manual runs (workflow_dispatch) can target either environment.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/core/**"
      - "packages/providers/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [prod, test]
        default: prod

permissions:
  contents: read

env:
  TARGET: ${{ inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod' }}

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test typecheck --filter=@xplorio/api...
      - run: pnpm --filter @xplorio/api build

      # The bundle has every dependency inlined, so the package needs no node_modules.
      - name: Assemble package
        working-directory: apps/api
        run: |
          mkdir -p ../../package
          cp -r host.json dist ../../package/
          node -e "require('fs').writeFileSync('../../package/package.json', JSON.stringify({name:'xplorio-api',private:true,type:'module',main:'dist/index.js'}, null, 2))"
          cd ../../package && zip -qr ../api.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: api.zip
          retention-days: 7

  deploy:
    name: Deploy to Azure Functions (${{ inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod' }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-api-${{ inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RG: ${{ vars[format('AZURE_RESOURCE_GROUP_{0}', inputs.environment || vars.AUTO_DEPLOY_ENV || 'prod')] }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-package

      - uses: azure/login@v2
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', env.TARGET)] }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the function app
        id: app
        run: |
          name=$(az functionapp list -g "$RG" --query "[0].name" -o tsv)
          host=$(az functionapp show -g "$RG" -n "$name" --query defaultHostName -o tsv)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Deploy package
        run: |
          az functionapp deployment source config-zip \
            -g "$RG" -n "${{ steps.app.outputs.name }}" --src api.zip

      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ steps.app.outputs.host }}/api/health"; then exit 0; fi
            echo "not ready yet ($i/10)"; sleep 15
          done
          exit 1
